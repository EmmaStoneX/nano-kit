# Cloudflare Pages 配置
name = "nano-banana-pro"
compatibility_date = "2024-01-01"

# Pages 项目配置
pages_build_output_dir = "dist"

# R2 存储桶绑定
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "nano-images"

